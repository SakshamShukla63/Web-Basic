<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <main class="calculator" aria-label="Calculator">
        <h1>Calculator</h1>
        <section class="display" aria-live="polite">
            <p class="previous" id="previous-display"></p>
            <input type="text" placeholder="0" id="inputbox" aria-label="Calculator display" readonly>
        </section>
        <div class="keypad">
        <div>
            <button class="operator utility" data-action="clear">AC</button>
            <button class="operator utility" data-action="delete">DEL</button>
            <button class="operator" data-value="%">%</button>
            <button class="operator" data-value="/">÷</button>
        </div>
        <div>
            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">×</button>
        </div>
        <div>
            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>
        </div>
        <div>
            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>
        </div>
        <div>
            <button data-value="00">00</button>
            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equals" data-action="calculate">=</button>
        </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
