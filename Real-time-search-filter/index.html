<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Search & Card Layout</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTK8y6Ffwk9eP3MNFpqYCtsvnHxWJ6g__Kq2GYWef2opw&s=10" type="image/x-icon">
</head>

<body>
    <div class="container">
        <!-- Action Header with Search and Add Button -->
        <div class="header-actions">
            <div class="search-wrapper">
                <span class="search-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                <input type="text" id="search-input" class="search-input" placeholder="Search profiles, topics..." autocomplete="off" />
            </div>
            <button id="open-modal-btn" class="btn primary-btn">+ Add Profile</button>
        </div>

        <div class="cards-wrapper" id="cards-container"></div>
    </div>

    <!-- Add Profile Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Add New Profile</h3>
                <button class="close-btn" id="close-modal-btn">&times;</button>
            </div>
            <form id="add-user-form">
                <div class="form-group">
                    <label for="user-name">Full Name</label>
                    <input type="text" id="user-name" placeholder="e.g. Alex Morgan" required>
                </div>
                <div class="form-group">
                    <label for="user-pic">Image URL</label>
                    <input type="url" id="user-pic" placeholder="https://images.unsplash.com/..." required>
                </div>
                <div class="form-group">
                    <label for="user-bio">Bio</label>
                    <textarea id="user-bio" rows="3" placeholder="A short bio..." required></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn secondary-btn" id="cancel-modal-btn">Cancel</button>
                    <button type="submit" class="btn primary-btn">Add Card</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
