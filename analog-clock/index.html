<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Analog Clock</title>
</head>
<body>
    <main class="clock" aria-label="Analog clock">
        <div class="numbers" aria-hidden="true">
            <span class="number number-12">12</span>
            <span class="number number-3">3</span>
            <span class="number number-6">6</span>
            <span class="number number-9">9</span>
        </div>
        <div class="tick tick-1"></div>
        <div class="tick tick-2"></div>
        <div class="tick tick-4"></div>
        <div class="tick tick-5"></div>
        <div class="tick tick-7"></div>
        <div class="tick tick-8"></div>
        <div class="tick tick-10"></div>
        <div class="tick tick-11"></div>
        <div class="hand hour-hand"></div>
        <div class="hand minute-hand"></div>
        <div class="hand second-hand"></div>
        <div class="center-dot"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
