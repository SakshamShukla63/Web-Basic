<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Currency Converter</title>
  
  <!-- SVG Favicon (Dollar Coin Icon) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 16h-2v-1.12a3.5 3.5 0 0 1-2.5-3.38h2a1.5 1.5 0 0 0 1.5 1.5 1.5 1.5 0 0 0 1.5-1.5c0-.83-.67-1.5-1.5-1.5h-1a3.5 3.5 0 0 1-3.5-3.5 3.5 3.5 0 0 1 2.5-3.38V7h2v1.12a3.5 3.5 0 0 1 2.5 3.38h-2a1.5 1.5 0 0 0-1.5-1.5 1.5 1.5 0 0 0-1.5 1.5c0 .83.67 1.5 1.5 1.5h1a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-2.5 3.38V18z'/></svg>" />
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="converter-card">
    <header class="app-header">
      <h2>Currency Converter</h2>
      <p class="subtitle">Check live exchange rates and convert world currencies.</p>
    </header>

    <form id="converter-form" onsubmit="return false;">
      
      <!-- Amount Input Block -->
      <div class="input-group">
        <label for="amount-input">Amount</label>
        <div class="input-wrapper">
          <span class="currency-symbol" id="base-symbol">$</span>
          <input 
            type="number" 
            id="amount-input" 
            value="100" 
            min="0" 
            step="any" 
            placeholder="0.00" 
            required 
          />
        </div>
      </div>

      <!-- Currency Selector Grid -->
      <div class="currency-selectors">
        
        <!-- From Currency Selector -->
        <div class="select-group">
          <label>From</label>
          <button type="button" class="currency-btn" id="from-btn">
            <img src="https://flagcdn.com/w40/us.png" alt="USD Flag" id="from-flag" class="flag-img" />
            <span class="code-text" id="from-code">USD</span>
            <span class="chevron">&#9662;</span>
          </button>
        </div>

        <!-- Swap Currencies Button -->
        <button type="button" class="swap-btn" id="swap-btn" title="Swap Currencies">
          &#8646;
        </button>

        <!-- To Currency Selector -->
        <div class="select-group">
          <label>To</label>
          <button type="button" class="currency-btn" id="to-btn">
            <img src="https://flagcdn.com/w40/eu.png" alt="EUR Flag" id="to-flag" class="flag-img" />
            <span class="code-text" id="to-code">EUR</span>
            <span class="chevron">&#9662;</span>
          </button>
        </div>

      </div>

      <!-- Result Card -->
      <div class="result-box">
        <div class="result-label">Converted Amount</div>
        <div class="result-value" id="result-text">---</div>
        <div class="rate-subtext" id="rate-subtext">Fetching latest exchange rates...</div>
      </div>

      <!-- Action Footer -->
      <div class="action-row">
        <button type="button" class="btn-secondary" id="copy-btn">Copy Result</button>
        <span class="last-updated" id="update-time">Updated: Just now</span>
      </div>

    </form>
  </main>

  <!-- Modal Dialog for Searchable Country/Currency Selection -->
  <div class="modal-backdrop" id="currency-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">Select Currency</h3>
        <button type="button" class="close-btn" id="modal-close">&times;</button>
      </div>
      <div class="search-box">
        <input 
          type="text" 
          id="currency-search" 
          placeholder="Search by country or currency code (e.g. INR, Japan, EUR)..." 
        />
      </div>
      <div class="currency-list" id="currency-list">
        <!-- Currency items rendered dynamically via script.js -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
