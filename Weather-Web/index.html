<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atmosphere — Modern Weather App</title>

  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Search Section -->
    <div class="search-wrapper">
      <i data-lucide="search" class="search-icon"></i>
      <input type="text" id="searchInput" class="search-box" placeholder="Search city (e.g. Delhi, London, Tokyo)..." autocomplete="off">
      <div id="suggestions" class="suggestions-list"></div>
    </div>

    <!-- Weather Content -->
    <div class="weather-grid" id="weatherContent">
      <div class="loader">Loading weather data...</div>
    </div>
  </div>

  <!-- External JavaScript -->
  <script src="script.js"></script>
</body>
</html>
