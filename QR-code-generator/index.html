<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelPerfect — Simple QR Generator</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code generation library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#f8fafc] text-slate-800 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="py-6 px-8 max-w-5xl mx-auto w-full flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-sm">Q</div>
            <span class="font-bold text-lg tracking-tight">PixelQR</span>
        </div>
        <span class="text-xs font-medium px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full border border-indigo-100">v1.0 Free</span>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="max-w-4xl w-full bg-white rounded-3xl shadow-xl shadow-slate-100 border border-slate-100 grid grid-cols-1 md:grid-cols-2 overflow-hidden">
            
            <!-- Left Side: Controls -->
            <div class="p-8 sm:p-10 flex flex-col justify-between">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-slate-900 mb-2">Create your QR code</h1>
                    <p class="text-slate-500 text-sm mb-6">Type a URL, note, or text below to instantly turn it into a scannable code.</p>

                    <!-- Input Field -->
                    <div class="space-y-4">
                        <div>
                            <label for="text-input" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Content or URL</label>
                            <textarea id="text-input" rows="4" placeholder="https://example.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/10 outline-none text-slate-700 text-sm transition resize-none"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Footer note inside control panel -->
                <div class="mt-8 pt-6 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                    <span>⚡ Instant generation</span>
                    <span>No tracking</span>
                </div>
            </div>

            <!-- Right Side: Preview & Download Card -->
            <div class="bg-slate-50 p-8 sm:p-10 flex flex-col items-center justify-center border-t md:border-t-0 md:border-l border-slate-100">
                <div class="text-center w-full flex flex-col items-center">
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-6">Live Preview</p>
                    
                    <!-- QR Box Wrapper -->
                    <div id="qrcode-container" class="bg-white p-5 rounded-2xl shadow-md shadow-slate-200/50 border border-slate-100 mb-6 inline-block transition-transform duration-300 hover:scale-[1.02]">
                        <div id="qrcode"></div>
                    </div>

                    <!-- Download Button -->
                    <button id="download-btn" class="w-full max-w-[220px] bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-6 rounded-xl transition shadow-lg shadow-indigo-600/25 flex items-center justify-center space-x-2 text-sm cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        <span>Download PNG</span>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Simple Footer -->
    <footer class="py-6 text-center text-xs text-slate-400">
        Built with care · Free for personal and commercial use.
    </footer>

    <!-- Script file -->
    <script src="script.js"></script>
</body>
</html>
