<body>
    <div class="ambient-glow"></div>
    <div class="ambient-glow two"></div>

    <div class="app-container">
        <header class="app-header">
            <div id="greetingBadge" class="greeting-badge">✨ Good day</div>
            <div class="app-title">
                <span>Focus & Flow</span>
                <span id="taskCounter" class="task-counter">0/0 done</span>
            </div>
            <div class="progress-track">
                <div id="progressFill" class="progress-fill"></div>
            </div>
        </header>

        <div class="input-box">
            <div class="input-wrapper">
                <input type="text" id="taskInput" placeholder="What needs to be done today?" autocomplete="off">
                <div class="priority-picker">
                    <span class="priority-dot p-low" title="Low Priority" data-priority="low"></span>
                    <span class="priority-dot p-med active" title="Medium Priority" data-priority="medium"></span>
                    <span class="priority-dot p-high" title="High Priority" data-priority="high"></span>
                </div>
                <button id="addBtn" class="add-btn">Add</button>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All Tasks</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="taskList" class="task-list"></ul>
        
        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon">🍃</div>
            <p>Your mind is clear. No tasks match this view.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
